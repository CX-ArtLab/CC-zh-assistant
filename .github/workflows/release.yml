name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        shell: powershell
        run: .\build.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCZhAssistant-windows
          path: dist/CCZhAssistant-windows.zip

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app and ZIP
        shell: bash
        run: bash macOS/build-macos.sh
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCZhAssistant-macOS-apple-silicon
          path: dist/CCZhAssistant-macOS-apple-silicon.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
      - name: Build Linux app and ZIP
        shell: bash
        run: bash linux/build-linux.sh
      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCZhAssistant-linux
          path: dist/CCZhAssistant-linux.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip --generate-notes --title "Claude Code 桌面版中文助手 ${{ github.ref_name }}"
